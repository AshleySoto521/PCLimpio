# Ejecuta las pruebas en Windows cada vez que se sube código o se abre un pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas automáticas
        run: python -m unittest discover -s tests -v
