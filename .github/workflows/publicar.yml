# Al crear una etiqueta de versión (por ejemplo v1.0.0), GitHub compila PCLimpio.exe en sus servidores
# y lo publica en la página "Releases" para que cualquiera lo descargue sin tener Python.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar que la etiqueta coincide con core/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from core.version import VERSION
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != VERSION:
              sys.exit(f"La etiqueta v{tag} no coincide con VERSION = {VERSION} en core/version.py")

      - name: Pruebas automáticas
        run: python -m unittest discover -s tests -v

      - name: Compilar PCLimpio.exe
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python build.py

      - name: Guardar el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PCLimpio
          path: |
            dist/PCLimpio.exe
            dist/PCLimpio.exe.sha256

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PCLimpio.exe
            dist/PCLimpio.exe.sha256
          generate_release_notes: true
